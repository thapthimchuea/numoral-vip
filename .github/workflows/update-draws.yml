name: Update Lao Pattana draws

on:
  schedule:
    # เวลาเป็น UTC (ไทย = UTC+7) — หวยลาวพัฒนาออกจันทร์–ศุกร์ ถ่ายทอดสด 20:00 น. ผลออกราว 20:30 น. (= 13:30 UTC)
    # รอบตั้งแต่ 12:00 น. ในวันออก จะ "เฝ้ารอผล" อยู่จนผลออก (GitHub มักเลื่อน/ข้ามรอบช่วงค่ำ จึงเผื่อหลายรอบ)
    - cron: "10 6 * * 1-5"      # 13:10 น. ล็อกชุดลุ้น + เฝ้ารอผล
    - cron: "50 8 * * 1-5"      # 15:50 น.
    - cron: "10 10 * * 1-5"     # 17:10 น.
    - cron: "20 11 * * 1-5"     # 18:20 น.
    - cron: "30 12 * * 1-5"     # 19:30 น.
    - cron: "5,25,50 13-16 * * 1-5"  # 20:05–23:50 น.
    - cron: "10 1 * * *"        # สำรองเช้าวันถัดไป 08:10 น. + ล็อกชุดลุ้นของวันนี้
    - cron: "20 4 * * *"        # 11:20 น. ล็อกชุดลุ้น (สำรอง)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # รอบที่เฝ้ารอผลอาจรันนานหลายชั่วโมง (ฟรีสำหรับ repo สาธารณะ)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test parser
        run: node scripts/update-draws.mjs --test
      - name: Fetch latest Lao Pattana results
        run: node scripts/update-draws.mjs
      - name: Lock numbers for the next draw (ชุดลุ้น)
        run: node scripts/lock-picks.mjs
      - name: Commit new draws / locked numbers
        run: bash scripts/commit-data.sh "Add new Lao Pattana draws / lock numbers"
      - name: Watch for today's result (เฝ้ารอผลวันนี้)
        env:
          WATCH_FROM: "13"
          WATCH_UNTIL: "23.5"
          WATCH_DAYS: "1-5"
        run: node scripts/watch-draw.mjs
      - name: Lock next draw + commit again
        run: |
          node scripts/lock-picks.mjs
          bash scripts/commit-data.sh "Add new Lao Pattana draws / lock numbers"
