name: Deploy friends link (Cloudflare)

# ลิงก์สำหรับเพื่อน (รหัสเชิญ) — deploy ขึ้น Cloudflare Workers ให้อัตโนมัติ
# ต้องมี GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_PASSWORD, SESSION_SECRET
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app.js", "index.html", "styles.css", "sw.js", "manifest.json", "vendor.js", "icons/**", "friends/**"]

concurrency:
  group: deploy-friends
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    defaults:
      run:
        working-directory: friends
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PASSWORD SESSION_SECRET; do
            if [ -z "${!v}" ]; then echo "ยังไม่ได้ตั้ง secret $v — ข้ามการ deploy"; echo "skip=1" >> $GITHUB_ENV; fi
          done
      - name: Install wrangler
        if: env.skip != '1'
        run: npm i --no-save wrangler@4
      - name: Find or create KV namespace "CODES"
        if: env.skip != '1'
        run: |
          ID=$(npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s.slice(s.indexOf("[")));const n=a.find(x=>/numoral-vip-friends.*CODES|^CODES$/.test(x.title));if(n)console.log(n.id)})')
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create CODES | tee /tmp/kv.txt
            ID=$(grep -oE '[0-9a-f]{32}' /tmp/kv.txt | head -1)
          fi
          test -n "$ID"
          echo "KV id: $ID"
          sed -i -E "s/^id = .*/id = \"$ID\"/" wrangler.toml
      - name: Copy app files and deploy
        if: env.skip != '1'
        run: |
          node deploy.mjs --copy
          npx wrangler deploy
      - name: Set secrets
        if: env.skip != '1'
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
